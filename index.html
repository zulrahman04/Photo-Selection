<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Selection Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi loading sederhana */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Style kustom untuk checkbox */
        .photo-checkbox:checked+div {
            border-color: #3b82f6;
            background-color: rgba(59, 130, 246, 0.1);
        }
    </style>
</head>

<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Setup Session Modal -->
    <div id="setupModal" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full mx-4 relative">
            <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Masuk ke Galeri</h2>
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="setupSession">Masukkan Project ID
                    Anda</label>
                <input type="text" id="setupSession"
                    class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Contoh: PRJ-001" onkeypress="if(event.key === 'Enter') startSession()" required>
            </div>
            <button id="startSessionBtn" onclick="startSession()"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition flex justify-center items-center gap-2">
                <span>Buka Galeri</span>
                <div id="startLoader" class="loader hidden" style="width: 16px; height: 16px; border-width: 2px;"></div>
            </button>
            <p id="setupError" class="text-red-500 text-sm text-center mt-4 hidden"></p>
        </div>
    </div>
    <!-- KONFIGURASI -->
    <script>
        const CONFIG = {
            FOLDER_ID: '', // Akan diisi otomatis
            APPS_SCRIPT_URL: '' // Akan diisi dari URL parameter
        };
    </script>

    <!-- Header & Floating Bar -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div
            class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-gray-900">Pilih Foto Anda</h1>
            <div class="flex items-center gap-4 w-full sm:w-auto">
                <input type="text" id="projectId" placeholder="Project ID / Nama Klien"
                    class="border border-gray-300 rounded-md px-3 py-2 w-full sm:w-64 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
                <div class="bg-blue-100 text-blue-800 font-semibold px-4 py-2 rounded-full whitespace-nowrap">
                    Terpilih: <span id="selectedCount">0</span>
                </div>
                <button id="submitBtnHeader" onclick="submitSelection()"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-full shadow-md transition duration-200 flex items-center gap-2 hidden">
                    <span>Kirim Pilihan</span>
                    <div id="submitLoaderHeader" class="loader hidden" style="width: 16px; height: 16px; border-width: 2px; border-top-color: white;"></div>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Pesan Status / Loading -->
        <div id="statusMessage" class="hidden mb-6 p-4 rounded-md text-center"></div>
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-12 hidden">
            <div class="loader mb-4"></div>
            <p class="text-gray-500">Memuat foto dari Google Drive...</p>
        </div>

        <!-- Grid Galeri -->
        <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Foto akan dirender di sini via JS -->
        </div>

        <!-- Tombol Submit -->
        <div class="mt-12 flex justify-center">
            <button id="submitBtn" onclick="submitSelection()"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-200 flex items-center gap-2 hidden">
                <span>Kirim Pilihan ke Editor</span>
                <div id="submitLoader" class="loader hidden" style="width: 20px; height: 20px; border-width: 3px;">
                </div>
            </button>
        </div>
    </main>

    <!-- Modal Preview Gambar / Video -->
    <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-90 flex items-center justify-center p-4">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-white hover:text-gray-300 z-50">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <div id="modalContentContainer" class="max-h-full max-w-full w-full flex items-center justify-center">
            <!-- Isi modal (img atau iframe) akan dirender di sini via JS -->
        </div>
    </div>

    <script>
        let photos = [];
        let selectedPhotos = new Map(); // fileId -> { fileName, note }

        // Fungsi untuk mengambil foto dari Google Drive via backend Apps Script
        async function fetchPhotos() {
            if (!CONFIG.FOLDER_ID) {
                showStatus('Folder ID tidak ditemukan.', 'error');
                return;
            }

            const grid = document.getElementById('galleryGrid');
            const loader = document.getElementById('loadingIndicator');

            grid.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const projectId = urlParams.get('session') || document.getElementById('projectId').value.trim();

                const response = await fetch(CONFIG.APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getPhotos', folderId: CONFIG.FOLDER_ID, projectId: projectId })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    photos = result.data;

                    if (photos.length === 0) {
                        showStatus('Tidak ada foto ditemukan di folder tersebut.', 'info');
                    } else {
                        renderGallery();
                        document.getElementById('submitBtn').classList.remove('hidden');
                        document.getElementById('submitBtnHeader').classList.remove('hidden');
                    }
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error('Error fetching photos:', error);
                showStatus('Gagal memuat foto: ' + error.message, 'error');
            } finally {
                loader.classList.add('hidden');
            }
        }

        // Render galeri foto
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = photos.map(photo => {
                const thumbUrl = photo.thumbnailLink;
                const isVideo = photo.mimeType && photo.mimeType.startsWith('video/');
                
                // Badge Status
                let badgeHtml = '';
                let isSubmitted = false;
                if (photo.status) {
                    isSubmitted = true;
                    let badgeColor = 'bg-yellow-500';
                    if (photo.status === 'In Progress') badgeColor = 'bg-purple-500';
                    if (photo.status === 'Done') badgeColor = 'bg-green-500';
                    badgeHtml = `<div class="absolute top-2 right-2 px-3 py-1 ${badgeColor} text-white text-xs font-bold rounded-full z-30 shadow-md">${photo.status}</div>`;
                }

                const playIconHtml = isVideo ? `<div class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none"><svg class="w-16 h-16 text-white opacity-80" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg></div>` : '';

                // Input Checkbox state (disabled jika sudah disubmit)
                const disabledAttr = isSubmitted ? 'disabled checked' : '';
                
                // Jika disubmit, tidak perlu indicator hover (tapi biarkan checked)
                const indClass = isSubmitted ? 'opacity-100 bg-blue-500 border-blue-500' : 'opacity-0 bg-white border-gray-300';
                const checkIconClass = isSubmitted ? '' : 'hidden';

                return `
                <div class="relative group bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
                    ${badgeHtml}
                    <label class="cursor-pointer block relative ${isSubmitted ? 'pointer-events-none' : ''}">
                        <input type="checkbox" class="photo-checkbox hidden" id="chk_${photo.id}" onchange="toggleSelection('${photo.id}', '${photo.name.replace(/'/g, "\\'")}')" ${disabledAttr}>
                        <div class="absolute inset-0 border-4 border-transparent transition-colors z-10 pointer-events-none rounded-t-xl ${isSubmitted ? 'border-blue-500 bg-blue-500 bg-opacity-10' : ''}"></div>
                        
                        <div class="relative h-48 w-full bg-gray-100 overflow-hidden">
                            <img src="${thumbUrl}" alt="${photo.name}" class="w-full h-full object-cover" loading="lazy">
                            ${playIconHtml}
                            
                            <!-- Action Buttons -->
                            <div class="absolute bottom-2 right-2 flex gap-2 z-20 pointer-events-auto">
                                <!-- Tombol Download -->
                                <button type="button" onclick="downloadPhoto('${photo.id}', event)" class="bg-black bg-opacity-60 hover:bg-opacity-80 text-white p-2 rounded-full transition" title="Download">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                </button>
                                <!-- Tombol Preview -->
                                <button type="button" onclick="openModal('${photo.id}', event)" class="bg-black bg-opacity-60 hover:bg-opacity-80 text-white p-2 rounded-full transition" title="Preview">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                                </button>
                            </div>
                        </div>
                    </label>
                    <div class="p-4">
                        <p class="text-sm font-medium text-gray-900 truncate mb-2" title="${photo.name}">${photo.name}</p>
                        <input type="text" id="note_${photo.id}" placeholder="${isSubmitted ? 'Tidak ada catatan' : 'Catatan edit (opsional)...'}" 
                            class="w-full text-sm border-b border-gray-300 focus:border-blue-500 focus:outline-none py-1 bg-transparent transition ${isSubmitted ? 'text-gray-500 cursor-not-allowed' : ''}"
                            onchange="updateNote('${photo.id}', this.value)" value="${photo.note || ''}" ${isSubmitted ? 'readonly' : ''}>
                    </div>
                    <!-- Indikator Check -->
                    <div id="ind_${photo.id}" class="absolute top-2 left-2 w-6 h-6 border-2 rounded-full flex items-center justify-center group-hover:opacity-100 transition shadow-sm check-indicator pointer-events-none z-20 ${indClass}">
                        <svg class="w-4 h-4 text-white ${checkIconClass}" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Handle checkbox perubahan
        function toggleSelection(fileId, fileName) {
            const isChecked = document.getElementById(`chk_${fileId}`).checked;
            const indicator = document.getElementById(`ind_${fileId}`);
            const checkIcon = indicator.querySelector('svg');
            const noteInput = document.getElementById(`note_${fileId}`);

            if (isChecked) {
                indicator.classList.remove('opacity-0', 'border-gray-300', 'bg-white');
                indicator.classList.add('bg-blue-500', 'border-blue-500');
                checkIcon.classList.remove('hidden');

                selectedPhotos.set(fileId, {
                    fileId: fileId,
                    fileName: fileName,
                    note: noteInput.value
                });
            } else {
                indicator.classList.add('opacity-0', 'border-gray-300', 'bg-white');
                indicator.classList.remove('bg-blue-500', 'border-blue-500');
                checkIcon.classList.add('hidden');

                selectedPhotos.delete(fileId);
            }
            updateCounter();
        }

        // Update catatan pada foto yang sudah dipilih
        function updateNote(fileId, note) {
            if (selectedPhotos.has(fileId)) {
                const data = selectedPhotos.get(fileId);
                data.note = note;
                selectedPhotos.set(fileId, data);
            }
        }

        function updateCounter() {
            document.getElementById('selectedCount').innerText = selectedPhotos.size;
        }

        // Modal Preview
        function openModal(fileId, event) {
            event.preventDefault(); // Mencegah checkbox terklik
            const photo = photos.find(p => p.id === fileId);
            if (photo) {
                const isVideo = photo.mimeType && photo.mimeType.startsWith('video/');
                const container = document.getElementById('modalContentContainer');
                
                if (isVideo) {
                    container.innerHTML = `<iframe src="https://drive.google.com/file/d/${photo.id}/preview" class="w-full h-[80vh] md:w-[80vw] border-0 rounded-lg shadow-xl" allow="autoplay"></iframe>`;
                } else {
                    const fullResUrl = photo.thumbnailLink;
                    container.innerHTML = `<img src="${fullResUrl}" alt="Preview" class="max-h-full max-w-full object-contain rounded">`;
                }
                
                document.getElementById('imageModal').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('imageModal').classList.add('hidden');
            document.getElementById('modalContentContainer').innerHTML = '';
        }

        function downloadPhoto(fileId, event) {
            event.preventDefault(); // Mencegah checkbox terklik
            
            // Menggunakan iframe tersembunyi agar tidak memicu aplikasi Google Drive terbuka di HP
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = `https://drive.google.com/uc?export=download&id=${fileId}`;
            document.body.appendChild(iframe);
            
            // Hapus iframe setelah beberapa saat agar DOM tetap bersih
            setTimeout(() => {
                document.body.removeChild(iframe);
            }, 3000);
        }

        // Menampilkan pesan status (sukses/error)
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800', 'bg-blue-100', 'text-blue-800');

            if (type === 'error') {
                statusDiv.classList.add('bg-red-100', 'text-red-800');
            } else if (type === 'success') {
                statusDiv.classList.add('bg-green-100', 'text-green-800');
            } else {
                statusDiv.classList.add('bg-blue-100', 'text-blue-800');
            }
        }

        // Submit data ke Google Apps Script
        async function submitSelection() {
            const urlParams = new URLSearchParams(window.location.search);
            const projectId = urlParams.get('session') || document.getElementById('projectId').value.trim();

            if (!projectId) {
                alert('Silakan masukkan Project ID atau Nama Klien terlebih dahulu.');
                document.getElementById('projectId').focus();
                return;
            }

            if (selectedPhotos.size === 0) {
                alert('Pilih setidaknya satu foto sebelum mengirim.');
                return;
            }

            if (!CONFIG.APPS_SCRIPT_URL) {
                alert('URL Apps Script tidak ditemukan di tautan Anda!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('submitLoader');
            const btnHeader = document.getElementById('submitBtnHeader');
            const loaderHeader = document.getElementById('submitLoaderHeader');
            
            btn.disabled = true;
            btnHeader.disabled = true;
            loader.classList.remove('hidden');
            loaderHeader.classList.remove('hidden');
            document.getElementById('statusMessage').classList.add('hidden');

            const payload = {
                action: 'submitSelection',
                projectId: projectId,
                selections: Array.from(selectedPhotos.values())
            };

            try {
                // Menggunakan mode 'no-cors' atau 'cors' tergantung setup GAS. 
                // POST ke GAS disarankan menggunakan text/plain agar tidak memicu OPTIONS preflight yg rumit
                const response = await fetch(CONFIG.APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === 'success') {
                    showStatus('Berhasil! Pilihan foto Anda telah dikirim ke Editor.', 'success');
                    // Reset pilihan
                    selectedPhotos.clear();
                    updateCounter();
                    document.querySelectorAll('.photo-checkbox').forEach(chk => {
                        if (chk.checked) chk.click(); // Uncheck
                    });
                    document.querySelectorAll('input[type="text"]').forEach(inp => {
                        if (inp.id !== 'projectId') inp.value = '';
                    });
                } else {
                    throw new Error(result.message || 'Terjadi kesalahan tidak diketahui.');
                }

            } catch (error) {
                console.error('Submit error:', error);
                showStatus('Gagal mengirim data: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btnHeader.disabled = false;
                loader.classList.add('hidden');
                loaderHeader.classList.add('hidden');
            }
        }

        function startSession() {
            const session = document.getElementById('setupSession').value.trim();
            if (!session) {
                alert('Harap isi Project ID');
                return;
            }
            const currentApi = encodeURIComponent(CONFIG.APPS_SCRIPT_URL);
            window.location.href = `?session=${encodeURIComponent(session)}&api=${currentApi}`;
        }

        // Fungsi baru untuk mengambil konfigurasi project dari backend
        async function fetchProjectConfig(projectId) {
            const loader = document.getElementById('loadingIndicator');
            const statusDiv = document.getElementById('statusMessage');

            loader.classList.remove('hidden');
            statusDiv.classList.add('hidden');

            try {
                const response = await fetch(CONFIG.APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getProjectConfig', projectId: projectId })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    // Berhasil menemukan project
                    CONFIG.FOLDER_ID = result.data.folderId;

                    const projectIdInput = document.getElementById('projectId');
                    projectIdInput.value = result.data.clientName ? `${projectId} - ${result.data.clientName}` : projectId;
                    projectIdInput.readOnly = true;
                    projectIdInput.classList.add('bg-gray-100', 'cursor-not-allowed');

                    // Setelah dapat Folder ID, langsung ambil foto
                    fetchPhotos();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                loader.classList.add('hidden');

                // Tampilkan modal agar bisa input ulang
                document.getElementById('setupModal').classList.remove('hidden');
                document.getElementById('setupError').innerText = error.message;
                document.getElementById('setupError').classList.remove('hidden');
            }
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const apiParam = urlParams.get('api');
            const sessionParam = urlParams.get('session');

            if (apiParam) {
                CONFIG.APPS_SCRIPT_URL = apiParam;
            }

            // Jika API URL tidak ada, kita tidak bisa melakukan apa-apa.
            if (!CONFIG.APPS_SCRIPT_URL) {
                document.getElementById('setupModal').classList.remove('hidden');
                document.getElementById('setupSession').classList.add('hidden');
                document.querySelector('label[for="setupSession"]').classList.add('hidden');
                document.getElementById('startSessionBtn').classList.add('hidden');
                document.getElementById('setupError').innerText = "Tautan tidak lengkap. Silakan gunakan link yang diberikan oleh fotografer Anda.";
                document.getElementById('setupError').classList.remove('hidden');
                return;
            }

            if (sessionParam) {
                // Ada parameter session di URL, kita tanya backend
                fetchProjectConfig(sessionParam);
            } else {
                // Tidak ada parameter, tampilkan form input
                document.getElementById('setupModal').classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
